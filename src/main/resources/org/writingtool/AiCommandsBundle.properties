CORRECT_INSTRUCTION = Output the grammatically and orthographically corrected text without comments or changes to content or style
STYLE_INSTRUCTION = Output the stylistic reformulated text without comments
REFORMULATE_INSTRUCTION = Output the rephrased text without comments
EXPAND_INSTRUCTION = Output the expanded text
SYNONYMS_INSTRUCTION = List at least 3 and a maximum of 20 synonyms of the following word, without comments